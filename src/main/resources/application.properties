spring.application.name=autoandes-backend
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
spring.datasource.username=${DB_USERNAME:KIT_EXAMEN}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Preserve the authorized schema's demo table and still execute V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expira-en-segundos=3600
